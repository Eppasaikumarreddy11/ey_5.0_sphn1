<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store - Product Catalog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .filter-select {
            padding: 0.8rem;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            background: white;
            color: #333;
            min-width: 150px;
        }

        .sort-select {
            padding: 0.8rem;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            background: white;
            color: #333;
            min-width: 150px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.3rem;
            padding: 3rem;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-category {
            color: #667eea;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #333;
            line-height: 1.4;
            flex-grow: 1;
        }

        .product-description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
            padding-top: 1rem;
        }

        .product-price {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: bold;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
        }

        .stars {
            color: #ffc107;
        }

        .rating-count {
            color: #666;
            font-size: 0.8rem;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
        }

        .no-results {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .results-info {
            color: white;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🛍️ Fake Store Catalog</h1>
            <p>Browse our amazing collection of products</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search products by name..."
                    onkeyup="filterAndDisplay()"
                >
            </div>
            <select class="filter-select" id="categoryFilter" onchange="filterAndDisplay()">
                <option value="">All Categories</option>
            </select>
            <select class="sort-select" id="sortSelect" onchange="filterAndDisplay()">
                <option value="default">Sort By</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Rating: High to Low</option>
                <option value="title">Title: A to Z</option>
            </select>
        </div>

        <!-- Results Info -->
        <div class="results-info" id="resultsInfo"></div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
            <div class="loading">
                <div class="spinner"></div>
                Loading products...
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let filteredProducts = [];

        // Fetch products from API
        async function fetchProducts() {
            try {
                const response = await fetch('https://fakestoreapi.com/products');
                if (!response.ok) throw new Error('Failed to fetch products');
                
                allProducts = await response.json();
                filteredProducts = [...allProducts];
                
                populateCategories();
                displayProducts();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productsGrid').innerHTML = 
                    `<div class="error">❌ Error loading products. Please try again later.</div>`;
            }
        }

        // Populate category filter
        function populateCategories() {
            const categories = [...new Set(allProducts.map(p => p.category))];
            const categoryFilter = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                categoryFilter.appendChild(option);
            });
        }

        // Filter and display products
        function filterAndDisplay() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            // Filter products
            filteredProducts = allProducts.filter(product => {
                const matchesSearch = product.title.toLowerCase().includes(searchTerm) ||
                                     product.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !selectedCategory || product.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            // Sort products
            switch(sortBy) {
                case 'price-low':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'rating':
                    filteredProducts.sort((a, b) => (b.rating?.rate || 0) - (a.rating?.rate || 0));
                    break;
                case 'title':
                    filteredProducts.sort((a, b) => a.title.localeCompare(b.title));
                    break;
            }

            displayProducts();
        }

        // Display products
        function displayProducts() {
            const grid = document.getElementById('productsGrid');
            const resultsInfo = document.getElementById('resultsInfo');

            // Update results info
            resultsInfo.textContent = `Showing ${filteredProducts.length} of ${allProducts.length} products`;

            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div class="no-results">No products found. Try a different search!</div>';
                return;
            }

            grid.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                    </div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <div class="product-title">${product.title}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-footer">
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="product-rating">
                                <span class="stars">★</span>
                                <span>${(product.rating?.rate || 0).toFixed(1)}</span>
                                <span class="rating-count">(${product.rating?.count || 0})</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
